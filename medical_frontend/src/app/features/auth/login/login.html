<div class="login-container">
  <div class="logo">
    <img src="assets/logo.png" alt="Clinics Flow Logo">
  </div>

  <div class="login-card">
    <h1>Login</h1>

    <form (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <input type="text" id="username" [value]="username()" (input)="username.set($any($event.target).value)" required
          autocomplete="username" placeholder="Username" />
      </div>

      <div class="form-group">
        <input type="password" id="password" [value]="password()" (input)="password.set($any($event.target).value)"
          required autocomplete="current-password" placeholder="********" />
      </div>

      <app-button type="submit" [loading]="isLoading()" [disabled]="isLoading()">
        Login
      </app-button>
    </form>
  </div>
</div>
