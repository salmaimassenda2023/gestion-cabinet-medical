<section id="doctors" class="doctor-section">
    <!-- Background Decoration -->
    <div class="glow-bg-top"></div>
    <div class="glow-bg-bottom"></div>

    <div class="container section-content">
        <div class="section-header">
            <span class="eyebrow">For Doctors</span>
            <h2 class="section-title">
                Why Doctors Choose
                <span class="text-gradient"> Clinics Flow</span>
            </h2>
            <p class="section-description">
                Spend more time with patients, less on admin. Our comprehensive platform
                handles the operational complexity so you can focus on what matters.
            </p>
        </div>

        <div class="features-grid">
            <div *ngFor="let feature of features" class="feature-card group">
                <div class="feature-bg-hover"></div>
                <div class="feature-content">
                    <div class="icon-wrapper">
                        <lucide-icon [img]="feature.icon" [size]="24" class="feature-icon"></lucide-icon>
                    </div>
                    <h3 class="feature-title">{{ feature.title }}</h3>
                    <p class="feature-description">{{ feature.description }}</p>
                </div>
            </div>
        </div>

        
    </div>
</section>
