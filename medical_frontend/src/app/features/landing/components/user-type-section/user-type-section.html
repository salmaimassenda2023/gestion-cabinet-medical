<section id="usertype" class="section-gradient">
    <div class="container section-wrapper">
        <div class="section-header">
            <span class="eyebrow">Get Started</span>
            <h2 class="section-title">
                I am a
                <span class="text-gradient"> ...</span>
            </h2>
            <p class="section-description">
                Select your role to see what Clinic Flow has to offer you.
            </p>

            <!-- Toggle Buttons -->
            <div class="toggle-buttons">
                <button (click)="setUserType('doctor')" class="toggle-btn"
                    [class.active-doctor]="userType() === 'doctor'" [class.inactive]="userType() !== 'doctor'">

                    <div class="toggle-icon-wrapper" [class.bg-primary]="userType() === 'doctor'"
                        [class.bg-muted]="userType() !== 'doctor'">
                        <lucide-icon [img]="StethoscopeIcon" [size]="24" [class.text-white]="userType() === 'doctor'"
                            [class.text-muted]="userType() !== 'doctor'"></lucide-icon>
                    </div>

                    <div class="toggle-text">
                        <p class="toggle-label" [class.text-primary]="userType() === 'doctor'">Doctor</p>
                        <p class="toggle-sub">Manage your clinic</p>
                    </div>
                </button>

                <button (click)="setUserType('patient')" class="toggle-btn"
                    [class.active-patient]="userType() === 'patient'" [class.inactive]="userType() !== 'patient'">

                    <div class="toggle-icon-wrapper" [class.bg-secondary]="userType() === 'patient'"
                        [class.bg-muted]="userType() !== 'patient'">
                        <lucide-icon [img]="UserIcon" [size]="24" [class.text-white]="userType() === 'patient'"
                            [class.text-muted]="userType() !== 'patient'"></lucide-icon>
                    </div>

                    <div class="toggle-text">
                        <p class="toggle-label" [class.text-secondary]="userType() === 'patient'">Patient</p>
                        <p class="toggle-sub">Find care easily</p>
                    </div>
                </button>
            </div>
        </div>

        <!-- Conditional Content -->
        <app-pricing-section *ngIf="userType() === 'doctor'"></app-pricing-section>

        <div *ngIf="userType() === 'patient'" class="chat-container animate-fade-in">
            <div class="chat-card card-elevated">
                <!-- Chatbot Header -->
                <div class="chat-header">
                    <div class="bot-avatar">
                        <lucide-icon [img]="BotIcon" [size]="32" class="text-white"></lucide-icon>
                    </div>
                    <div>
                        <h3 class="chat-title">Clinic Flow Assistant</h3>
                        <p class="chat-status">
                            <span class="status-dot"></span>
                            Online - Ready to help
                        </p>
                    </div>
                </div>

                <!-- Chat Messages -->
                <div class="chat-messages">
                    <div *ngFor="let chat of chatHistory()" class="message-row"
                        [class.message-user]="chat.role === 'user'" [class.message-bot]="chat.role === 'bot'">
                        <div class="message-bubble" [class.bubble-user]="chat.role === 'user'"
                            [class.bubble-bot]="chat.role === 'bot'">
                            <p>{{ chat.message }}</p>
                        </div>
                    </div>
                </div>

                <!-- Chat Input -->
                <div class="chat-input-area">
                    <div class="input-row">
                        <input type="text" [ngModel]="chatMessage()" (ngModelChange)="chatMessage.set($event)"
                            (keydown.enter)="handleSendMessage()"
                            placeholder="Ask about clinics, appointments, pricing..." class="chat-input" />
                        <button (click)="handleSendMessage()" class="send-btn btn-primary-gradient">
                            <lucide-icon [img]="SendIcon" [size]="20" class="text-white"></lucide-icon>
                        </button>
                    </div>
                    <div class="suggestions-row">
                        <button *ngFor="let suggestion of suggestions" (click)="handleSuggestion(suggestion)"
                            class="suggestion-chip">
                            {{ suggestion }}
                        </button>
                    </div>
                </div>
            </div>

            <p class="chat-footer-text">
                Our AI assistant is available 24/7 to help you find the right care.
            </p>
        </div>
    </div>
</section>
