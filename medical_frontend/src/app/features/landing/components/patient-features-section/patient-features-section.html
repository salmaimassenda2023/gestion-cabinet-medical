<section id="patients" class="section-gradient py-24">
    <div class="container">
        <div class="section-header">
            <span class="eyebrow">For Patients</span>
            <h2 class="section-title">
                What's Inside
                <span class="text-gradient"> for You</span>
            </h2>
            <p class="section-description">
                Finding the right care shouldn't be complicated. Our platform makes it easy to discover,
                book, and manage your healthcare appointments.
            </p>
        </div>

        <div class="features-grid">
            <div *ngFor="let feature of features; let i = index" class="feature-card card-elevated group"
                [style.animationDelay]="(i * 0.1) + 's'">

                <div class="icon-wrapper">
                    <lucide-icon [img]="feature.icon" [size]="28" class="feature-icon"></lucide-icon>
                </div>

                <div class="feature-text-content">
                    <h3 class="feature-title">{{ feature.title }}</h3>
                    <p class="feature-description">{{ feature.description }}</p>
                </div>
            </div>
        </div>
    </div>
</section>
