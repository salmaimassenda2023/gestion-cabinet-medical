<section id="home" class="hero-section">
    <!-- Background -->
    <div class="hero-bg-container">
        <img src="/assets/hero-bg.jpg" alt="" class="hero-bg-image" />
        <div class="hero-overlay"></div>
    </div>

    <!-- Floating Elements -->
    <div class="floating-bubble bubble-1 animate-float"></div>
    <div class="floating-bubble bubble-2 animate-float-delayed"></div>
    <div class="floating-bubble bubble-3 animate-float"></div>

    <div class="container hero-content">
        <div class="hero-wrapper">


            <!-- Main Headline -->
            <h1 class="hero-heading animate-fade-up delay-1">
                <span class="shadow-text">Healthcare</span>
                <br />
                <span class="text-gradient">management</span>

            </h1>

            <!-- Subheadline -->
            <p class="hero-subheading animate-fade-up delay-2">
                The all-in-one platform connecting doctors and patients.
                Streamline appointments, medical records, and payments effortlessly.
            </p>

            <!-- CTA Buttons -->
            <div class="hero-ctas animate-fade-up delay-3">
                <button class="btn-white" (click)="scrollToSection('usertype')">
                    Get Started
                    <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </button>
            
            </div>


        </div>
    </div>
</section>
