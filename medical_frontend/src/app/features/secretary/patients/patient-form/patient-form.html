<form [formGroup]="patientForm" (ngSubmit)="onSubmit()" class="patient-form">
    <div class="form-row">
        <div class="form-group">
            <label for="cin">CIN</label>
            <input type="text" id="cin" formControlName="cin" placeholder="Enter CIN">
        </div>
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" formControlName="name" placeholder="Enter name">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="age">Age</label>
            <input type="number" id="age" formControlName="age" placeholder="Age">
        </div>
        <div class="form-group">
            <label for="mutuelleType">Mutuelle Type</label>
            <select id="mutuelleType" formControlName="mutuelleType">
                <option value="">Select Type</option>
                <option value="CNAM">CNAM</option>
                <option value="CIMR">CIMR</option>
                <option value="Private">Private</option>
                <option value="None">None</option>
            </select>
        </div>
    </div>

    <div class="form-group">
        <label>Gender</label>
        <div class="gender-options">
            <label class="radio-label">
                <input type="radio" formControlName="gender" value="Male"> Male
            </label>
            <label class="radio-label">
                <input type="radio" formControlName="gender" value="Female"> Female
            </label>
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="patientForm.invalid">
            {{ patient ? 'Update Patient' : 'Add Patient' }}
        </button>
    </div>
</form>
