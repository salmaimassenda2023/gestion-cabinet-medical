<form [formGroup]="appointmentForm" (ngSubmit)="onSubmit()" class="appointment-form">
    <div class="form-group">
        <label for="patientId">Patient</label>
        <select id="patientId" formControlName="patientId">
            <option value="" disabled>Select a patient</option>
            <option *ngFor="let p of patients" [value]="p.id">{{ p.prenom }} {{ p.nom }} ({{ p.cin }})</option>
        </select>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" formControlName="date">
        </div>
        <div class="form-group">
            <label for="hour">Hour</label>
            <input type="time" id="hour" formControlName="hour">
        </div>
    </div>

    <div class="form-group">
        <label for="type">Type</label>
        <select id="type" formControlName="type">
            <option value="CONSULTATION">Consultation</option>
            <option value="CONTROLE">Contrôle</option>
            <option value="URGENCE">Urgence</option>
            <option value="AUTRE">Autre</option>
        </select>
    </div>

    <div class="form-group">
        <label for="note">Note</label>
        <textarea id="note" formControlName="note" rows="3" placeholder="Add notes..."></textarea>
    </div>

    <div class="form-actions">
        <button type="button" class="btn-delete" *ngIf="appointment" (click)="onDelete()">Delete</button>
        <div class="spacer"></div>
        <button type="button" class="btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="appointmentForm.invalid">
            {{ appointment ? 'Update Appointment' : 'Add Appointment' }}
        </button>
    </div>
</form>
