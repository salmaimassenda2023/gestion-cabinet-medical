<div class="payments-container">

    <!-- Loading State -->
    <div *ngIf="isLoading" class="loading-state">
        <div class="loading-spinner"></div>
        <p>Loading payment data...</p>
    </div>

    <!-- Main Content -->
    <div *ngIf="!isLoading">
        <!-- Header -->
        <div class="payments-header">
            <div class="header-info">
                <h1>
                    <i class="fas fa-file-invoice-dollar"></i>
                    Financial Management
                </h1>
                <p>Manage invoices and payments</p>
            </div>
            <button class="btn-primary" (click)="openPaymentForm()">
                <i class="fas fa-plus"></i> Process New Payment
            </button>
        </div>

        <!-- Payments Table -->
        <div class="table-card">
            <table class="payments-table">
                <thead>
                    <tr>
                        <th>Invoice #</th>
                        <th>Patient</th>
                        <th>Date</th>
                        <th>Amount</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let payment of payments">
                        <td class="invoice-id">#{{ payment.idFacture }}</td>
                        <td class="patient-name">
                            <i class="fas fa-user-circle"></i>
                            {{ payment.patientName }}
                        </td>
                        <td>{{ formatDate(payment.dateFacture) }}</td>
                        <td class="amount">{{ payment.montantTotal }} MAD</td>
                        <td>
                            <span class="status-badge" [class]="payment.statut?.toLowerCase()">
                                {{ payment.statut }}
                            </span>
                        </td>
                        <td class="actions">

                            <button class="btn-icon download" (click)="downloadPDF(payment.idFacture)"
                                title="Download PDF">
                                <i class="fas fa-download"></i>
                            </button>
                            <button class="btn-icon status" *ngIf="payment.statut === 'EN_ATTENTE'"
                                (click)="updateStatus(payment, 'PAYEE')" title="Mark as Paid">
                                <i class="fas fa-check-circle"></i>
                            </button>
                            <button class="btn-icon delete" (click)="openDeleteModal(payment)" title="Delete">
                                <i class="fas fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                    <tr *ngIf="payments.length === 0">
                        <td colspan="6" class="no-data">
                            <i class="fas fa-inbox"></i>
                            <p>No invoices found</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <app-payment-form [isOpen]="isPaymentFormOpen" [cabinetId]="currentCabinetId" (close)="closePaymentForm()"
        (paymentCreated)="onPaymentCreated($event)">
    </app-payment-form>



</div>
