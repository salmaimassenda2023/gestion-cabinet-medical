<div class="dashboard-container">
  <!-- Hero Header Section -->
  <div class="hero-section">
    <!-- Abstract floating shapes -->
    <div class="floating-shapes-container">
      <div class="floating-shape shape-1"></div>
      <div class="floating-shape shape-2"></div>
      <div class="floating-shape shape-3"></div>
      <div class="floating-shape shape-4"></div>
    </div>

    <div class="hero-content">
      <!-- Top Navigation -->
      <div class="top-navigation">
        <!-- Logo on the left -->
        <img [src]="logoPath" alt="Clinics Flow" class="logo" />

        <!-- Center Navigation -->
        <div class="nav-center">
          <!-- Users icon -->
          <div class="nav-icon" routerLink="/admin/users">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                <path d="M16 3.13a4 4 0 0 1 0 7.75" />
              </svg>
            </div>
          </div>

          <!-- Clinics icon -->
          <div class="nav-icon" routerLink="/admin/clinics">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                <polyline points="9 22 9 12 15 12 15 22" />
              </svg>
            </div>
          </div>

          <!-- Medicaments icon -->
          <div class="nav-icon" routerLink="/admin/medicaments">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
                <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
              </svg>
            </div>
          </div>

          <!-- Payments icon -->
          <div class="nav-icon" routerLink="/admin/payments">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="1" y="4" width="22" height="16" rx="2" ry="2" />
                <line x1="1" y1="10" x2="23" y2="10" />
              </svg>
            </div>
          </div>
        </div>

        <!-- Right Icons -->
        <div class="nav-right">
          <div class="header-icon" (click)="toggleNotifications()">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                <path d="M13.73 21a2 2 0 0 1-3.46 0" />
              </svg>
              <div class="notification-badge" *ngIf="notifications.length > 0"></div>
            </div>
          </div>
          <div class="header-icon" routerLink="/admin/profile">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
            </div>
          </div>
          <div class="header-icon" (click)="logout()">
            <div class="icon-wrapper">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                <polyline points="16 17 21 12 16 7" />
                <line x1="21" y1="12" x2="9" y2="12" />
              </svg>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Cards -->
      <div class="stats-container">
        <div *ngFor="let stat of stats" class="stat-card">
          <span class="stat-title">{{stat.title}}</span>
          <div class="stat-content">
            <div class="stat-icon-wrapper">
              <i [class]="getIconClass(stat.icon)"></i>
            </div>
            <div class="stat-values">
              <span class="stat-value">{{stat.value}}</span>
              <span class="stat-subtitle">{{stat.subtitle}}</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Income Details & Notifications Section -->
  <div class="content-section">
    <!-- Income Details - 3/4 width -->
    <div class="income-card">
      <div class="income-header">
        <h2 class="section-title">Income Details</h2>
        <select [(ngModel)]="selectedMonth" class="month-select">
          <option value="january">January</option>
          <option value="february">February</option>
          <option value="march">March</option>
          <option value="april">April</option>
          <option value="may">May</option>
          <option value="june">June</option>
          <option value="july">July</option>
          <option value="august">August</option>
          <option value="september">September</option>
          <option value="october">October</option>
          <option value="november">November</option>
          <option value="december">December</option>
        </select>
      </div>

      <!-- Chart Area - Using the IncomeChartComponent -->
      <div class="chart-container">
        <app-income-chart [data]="incomeData"></app-income-chart>
      </div>
    </div>

    <!-- Notifications - 1/4 width -->
    <div class="notifications-card">
      <div class="notifications-header">
        <h2 class="section-title">Notifications</h2>
        <span class="notification-count">{{notifications.length}} new</span>
      </div>

      <div class="notifications-list">
        <div *ngFor="let notification of notifications" class="notification-item">
          <div class="notification-icon-wrapper">
            <i [class]="getIconClass(notification.icon)"></i>
          </div>
          <div class="notification-content">
            <p class="notification-title">{{notification.title}}</p>
            <p class="notification-time">{{notification.time}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
