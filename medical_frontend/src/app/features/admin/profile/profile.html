<!DOCTYPE html>
<html lang="en">

<body>
    <div class="container">
        <app-header (logout)="logout()"></app-header>
        <app-sidebar></app-sidebar>

        <div class="main-content">
            <div class="profile-layout">
                <!-- Left Side: Personal Info -->
                <div class="profile-card">
                    <div class="card-header">
                        <h2>Personal Information</h2>
                        <p>Update your account details and contact information.</p>
                    </div>
                    <form [formGroup]="personalForm" (ngSubmit)="onUpdatePersonal()">
                        <div class="form-row">
                            <div class="form-group">
                                <label>First Name</label>
                                <input type="text" formControlName="firstName" placeholder="First Name">
                            </div>
                            <div class="form-group">
                                <label>Last Name</label>
                                <input type="text" formControlName="lastName" placeholder="Last Name">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Username / Email</label>
                            <input type="email" formControlName="email" placeholder="Email Address">
                        </div>
                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="text" formControlName="phone" placeholder="Phone Number">
                        </div>
                        <button type="submit" class="save-btn" [disabled]="personalForm.invalid">Save Changes</button>
                    </form>
                </div>

                <!-- Right Side: Security -->
                <div class="profile-card">
                    <div class="card-header">
                        <h2>Security</h2>
                        <p>Change your password to keep your account secure.</p>
                    </div>
                    <form [formGroup]="passwordForm" (ngSubmit)="onUpdatePassword()">
                        <div class="form-group">
                            <label>Old Password</label>
                            <input type="password" formControlName="oldPassword" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label>New Password</label>
                            <input type="password" formControlName="newPassword" placeholder="••••••••">
                        </div>
                        <div class="form-group">
                            <label>Confirm New Password</label>
                            <input type="password" formControlName="confirmPassword" placeholder="••••••••">
                        </div>
                        <div class="error-msg"
                            *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched">
                            Passwords do not match
                        </div>
                        <button type="submit" class="save-btn" [disabled]="passwordForm.invalid">Update
                            Password</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Logout Confirmation Modal -->
    <app-modal [isOpen]="isLogoutModalOpen" title="Confirm Logout" confirmText="Logout" [isDestructive]="true"
        (close)="isLogoutModalOpen = false" (confirm)="confirmLogout()">
        <p>Are you sure you want to logout? You will need to login again to access your account.</p>
    </app-modal>
</body>

</html>
