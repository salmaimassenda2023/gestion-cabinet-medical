<!DOCTYPE html>
<html lang="en">

<body>
    <div class="container">
        <app-header (logout)="logout()" (searchChange)="onSearch($event)"></app-header>
        <app-sidebar></app-sidebar>

        <div class="main-content">
            <app-medicament-table [medicaments]="filteredMedicaments" [currentPage]="1" [totalPages]="1"
                (import)="triggerImport()" (edit)="editMed($event)" (delete)="deleteMed($event)">
            </app-medicament-table>

            <input type="file" #fileInput style="display: none;" (change)="onFileImported($event)" accept=".csv,.txt">
        </div>
    </div>

    <!-- Delete Confirmation Modal -->
    <app-modal [isOpen]="isDeleteModalOpen" title="Delete Medicament" confirmText="Delete" [isDestructive]="true"
        (close)="isDeleteModalOpen = false" (confirm)="confirmDelete()">
        <p>Are you sure you want to delete <strong>{{ selectedMed?.name }}</strong>? This action cannot be undone.</p>
    </app-modal>

    <!-- Logout Confirmation Modal -->
    <app-modal [isOpen]="isLogoutModalOpen" title="Confirm Logout" confirmText="Logout" [isDestructive]="true"
        (close)="isLogoutModalOpen = false" (confirm)="confirmLogout()">
        <p>Are you sure you want to logout? You will need to login again to access your account.</p>
    </app-modal>
</body>

</html>
