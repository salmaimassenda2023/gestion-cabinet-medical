<app-modal [isOpen]="true" title="Secretary Management" [showFooter]="false" (close)="onClose()">
    <div class="mgmt-container">
        <div class="mgmt-header">
            <h3>Manage Your Secretaries</h3>
            <button class="btn-add-sec" (click)="addSecretary()">
                <i class="fas fa-plus"></i> Add New
            </button>
        </div>

        <div class="sec-table-wrapper">
            <table class="sec-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let sec of secretaries">
                        <td>{{ sec.name }}</td>
                        <td>{{ sec.email }}</td>
                        <td>{{ sec.phone }}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-icon edit" (click)="editSecretary(sec)">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-icon delete" (click)="deleteSecretary(sec.id)">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</app-modal>
