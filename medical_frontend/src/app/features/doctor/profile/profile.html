<div class="profile-portal">
    <!-- Action Bar -->
    <div class="action-bar">
        <a routerLink="/doctor" class="back-btn-pill">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <div class="section-label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
            </svg>
            Profile
        </div>
    </div>

    <div class="profile-layout">
        <!-- Left Side: Personal & Clinic Info -->
        <div class="profile-card">
            <div class="card-header">
                <h2>Personal Information</h2>
                <p>Update your professional and clinic details.</p>
            </div>
            <form [formGroup]="personalForm" (ngSubmit)="onUpdatePersonal()">
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" formControlName="firstName" placeholder="First Name">
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" formControlName="lastName" placeholder="Last Name">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" formControlName="email" placeholder="Email Address">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="text" formControlName="phone" placeholder="Phone Number">
                    </div>
                </div>
                <div class="form-group">
                    <label>Specialty</label>
                    <input type="text" formControlName="specialty" placeholder="e.g. Cardiologist">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Clinic Name</label>
                        <input type="text" formControlName="clinicName" placeholder="Clinic Name">
                    </div>
                    <div class="form-group">
                        <label>Clinic Address</label>
                        <input type="text" formControlName="clinicAddress" placeholder="Clinic Address">
                    </div>
                </div>
                <button type="submit" class="save-btn" [disabled]="personalForm.invalid">Save Changes</button>
            </form>
        </div>

        <!-- Right Side: Security -->
        <div class="profile-card">
            <div class="card-header">
                <h2>Security</h2>
                <p>Change your password to keep your account secure.</p>
            </div>
            <form [formGroup]="passwordForm" (ngSubmit)="onUpdatePassword()">
                <div class="form-group">
                    <label>Old Password</label>
                    <input type="password" formControlName="oldPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" formControlName="newPassword" placeholder="••••••••">
                </div>
                <div class="form-group">
                    <label>Confirm New Password</label>
                    <input type="password" formControlName="confirmPassword" placeholder="••••••••">
                </div>
                <div class="error-msg"
                    *ngIf="passwordForm.errors?.['mismatch'] && passwordForm.get('confirmPassword')?.touched">
                    Passwords do not match
                </div>
                <button type="submit" class="save-btn" [disabled]="passwordForm.invalid">Update Password</button>
            </form>
        </div>
    </div>
</div>
