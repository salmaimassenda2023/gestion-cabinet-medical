<div class="doctor-portal">
    <!-- Left Column: Stats & Management (Teal Gradient) -->
    <div class="stats-sidebar">
        <div class="sidebar-header">
            <div class="logo-container">
                <img [src]="logoPath" alt="Clinics Flow" class="dashboard-logo" />
            </div>
            <div class="welcome-header">
                <span class="current-date">{{ currentDate | date:'EEEE, d MMMM yyyy' }}</span>
                <h1 class="welcome-text">Welcome Doctor, {{ doctorName }}</h1>
            </div>
        </div>

        <div class="stats-vertical-list">
            <div class="large-stat-card" *ngFor="let stat of statsItems">
                <div class="stat-icon-bg">
                    <i [class]="getIconClass(stat.icon)"></i>
                </div>
                <div class="stat-details">
                    <span class="stat-value">{{ stat.value }}</span>
                    <span class="stat-label">{{ stat.title }}</span>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="patient-mgmt-link" routerLink="/secretary">
                <span>Secretary Space</span>
                <i class="fas fa-arrow-right"></i>
            </div>
        </div>
    </div>

    <!-- Right Column: Full-Year Calendar & Actions -->
    <div class="actions-panel">
        <div class="panel-header">
            <div class="header-actions-row">
                <div class="header-icon-btn" routerLink="/doctor/profile">
                    <i class="fas fa-user-circle"></i>
                </div>
                <div class="header-icon-btn">
                    <i class="fas fa-bell"></i>
                    <span class="badge" *ngIf="notifications.length > 0">{{ notifications.length }}</span>
                </div>
                <div class="header-icon-btn logout" (click)="onLogout()">
                    <i class="fas fa-sign-out-alt"></i>
                </div>
            </div>
        </div>

        <div class="year-calendar-glass-card">
            <div class="year-header">
                <h1 class="year-display">{{ currentYear }}</h1>
            </div>

            <div class="months-grid">
                <div *ngFor="let month of yearCalendar" class="month-container">
                    <h3 class="month-label">{{ month.name | uppercase }}</h3>
                    <div class="mini-weekdays">
                        <span *ngFor="let day of weekDays">{{ day }}</span>
                    </div>
                    <div class="mini-days-grid">
                        <div *ngFor="let item of month.days" [class.today]="item.isToday" [class.empty]="!item.day"
                            class="mini-day">
                            {{ item.day }}
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="button-row">
            <button class="action-btn-flex btn-teal" routerLink="/doctor/consultation">
                <i class="fas fa-stethoscope"></i>
                Current Patient
            </button>
            <button class="action-btn-flex btn-cyan" routerLink="/doctor/secretary-management">
                <i class="fas fa-user-cog"></i>
                Management Secretary
            </button>
        </div>
    </div>
</div>
