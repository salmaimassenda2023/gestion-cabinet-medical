<!-- Action Bar -->
<div class="action-bar">
    <button class="add-btn" (click)="onAdd()">ADD</button>
    <div class="title-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
        </svg>
        Clinics
    </div>
</div>

<!-- Card -->
<div class="card">
    <!-- Card Header -->
    <div class="card-header">
        <div class="filter-wrapper">
            <button class="filter-btn" (click)="toggleFilterMenu()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                </svg>
                {{ getFilterLabel() }}
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    style="width: 12px; height: 12px;">
                    <polyline points="6 9 12 15 18 9" />
                </svg>
            </button>
            <div class="filter-menu" *ngIf="showFilterMenu">
                <button (click)="setFilter('all')">All Status</button>
                <button (click)="setFilter('active')">Active</button>
                <button (click)="setFilter('deactivate')">Deactivate</button>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>LOGO</th>
                    <th>NAME</th>
                    <th>ADDRESS</th>
                    <th>SPECIALTY</th>
                    <th>STATUS</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let clinic of clinics">
                    <td>{{ clinic.id }}</td>
                    <td>
                        <img *ngIf="clinic.logo" [src]="clinic.logo" alt="Logo" class="clinic-logo-img">
                        <span *ngIf="!clinic.logo">-</span>
                    </td>
                    <td>{{ clinic.name }}</td>
                    <td>{{ clinic.address }}</td>
                    <td>{{ clinic.specialty }}</td>
                    <td><span class="status-badge" [ngClass]="getStatusClass(clinic.status)">{{
                            getStatusText(clinic.status)
                            }}</span></td>
                    <td>
                        <div class="actions">
                            <button class="action-btn edit-btn" (click)="onEdit(clinic)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                                </svg>
                            </button>
                            <button class="action-btn delete-btn" (click)="onDelete(clinic)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6" />
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination">
        <button class="page-btn" (click)="previousPage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                style="width: 14px; height: 14px;">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>
        <span class="page-info">{{ currentPage }} .. {{ totalPages }}</span>
        <button class="page-btn" (click)="nextPage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                style="width: 14px; height: 14px;">
                <polyline points="9 18 15 12 9 6" />
            </svg>
        </button>
    </div>
</div>
