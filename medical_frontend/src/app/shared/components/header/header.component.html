<!-- Logo -->
<a [routerLink]="logoLink">
    <img [src]="logoPath" alt="Clinics Flow" class="logo" />
</a>

<!-- Header -->
<header class="header">
    <div class="search-bar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8" />
            <path d="M21 21l-4.35-4.35" />
        </svg>
        <input type="text" placeholder="Search..." (input)="onSearch($event)">
    </div>
    <div class="header-icons">
        <!-- Notifications -->
        <div class="notification-wrapper">
            <div class="header-icon" (click)="toggleNotifications()">
                <div class="icon-wrapper">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
                        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
                    </svg>
                    <span class="badge" *ngIf="notifications.length > 0">{{ notifications.length }}</span>
                </div>
            </div>

            <div class="notification-popover" *ngIf="showNotifications">
                <div class="popover-header">
                    <h3>Notifications</h3>
                </div>
                <div class="popover-body">
                    <div class="notification-item" *ngFor="let n of notifications">
                        <div class="notif-content">
                            <p>{{ n.text }}</p>
                            <span class="notif-time">{{ n.time }}</span>
                        </div>
                        <button class="delete-notif" (click)="deleteNotification(n.id, $event)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 6h18m-2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                            </svg>
                        </button>
                    </div>
                    <div class="no-notif" *ngIf="notifications.length === 0">
                        No new notifications
                    </div>
                </div>
            </div>
        </div>

        <a class="header-icon" [routerLink]="profileLink">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
        </a>
        <div class="header-icon" (click)="onLogout()">
            <div class="icon-wrapper">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </div>
        </div>
    </div>
</header>
