<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="user-form">
    <div class="form-group" *ngIf="user?.id">
        <label>User ID</label>
        <input type="text" [value]="user?.id" readonly class="readonly-input">
    </div>

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" formControlName="name" placeholder="Enter name">
        <div class="error-msg" *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid">
            Name is required (min 3 chars)
        </div>
    </div>

    <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" formControlName="email" placeholder="Enter email">
        <div class="error-msg" *ngIf="userForm.get('email')?.touched && userForm.get('email')?.invalid">
            Valid email is required
        </div>
    </div>

    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="text" id="phone" formControlName="phone" placeholder="Enter phone number">
    </div>

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
            <option value="active">Active</option>
            <option value="deactivate">Deactivate</option>
        </select>
    </div>

    <div class="form-group signature-section" *ngIf="isDoctor">
        <label>Signature</label>
        <div class="capture-toggle">
            <button type="button" [class.active]="captureMode === 'draw'" (click)="setCaptureMode('draw')">Draw</button>
            <button type="button" [class.active]="captureMode === 'upload'"
                (click)="setCaptureMode('upload')">Upload</button>
        </div>

        <div class="capture-container" [hidden]="captureMode !== 'draw'">
            <canvas #signatureCanvas width="400" height="150" (mousedown)="startDrawing($event)"
                (mousemove)="draw($event)" (mouseup)="stopDrawing()" (mouseleave)="stopDrawing()"
                (touchstart)="startDrawing($event)" (touchmove)="draw($event)" (touchend)="stopDrawing()">
            </canvas>
            <button type="button" class="btn-clear" (click)="clearCanvas()">Clear</button>
        </div>

        <div class="capture-container" *ngIf="captureMode === 'upload'">
            <input type="file" (change)="onFileSelected($event)" accept="image/*">
            <div class="preview" *ngIf="userForm.get('signature')?.value">
                <label class="preview-label">Current Signature</label>
                <img [src]="userForm.get('signature')?.value" alt="Preview">
            </div>
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="userForm.invalid">
            {{ user ? 'Update User' : 'Add User' }}
        </button>
    </div>
</form>
