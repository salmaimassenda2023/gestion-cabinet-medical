<!-- Action Bar -->
<div class="action-bar">
    <button class="import-btn" (click)="onImport()">IMPORT</button>
    <div class="title-tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
        </svg>
        Medicaments
    </div>
</div>

<!-- Card -->
<div class="card">
    <!-- Table -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>NAME</th>
                    <th>ACTIONS</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let med of medicaments">
                    <td>{{ med.id }}</td>
                    <td>{{ med.name }}</td>
                    <td>
                        <div class="actions">
                            <button class="action-btn edit-btn" (click)="onEdit(med)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                                </svg>
                            </button>
                            <button class="action-btn delete-btn" (click)="onDelete(med)">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6" />
                                    <path
                                        d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
                <tr *ngIf="medicaments.length === 0">
                    <td colspan="3" style="text-align: center; color: #999; padding: 40px;">
                        No medicaments imported yet. Click IMPORT to upload a list.
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <div class="pagination" *ngIf="medicaments.length > 0">
        <button class="page-btn" (click)="previousPage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                style="width: 14px; height: 14px;">
                <polyline points="15 18 9 12 15 6" />
            </svg>
        </button>
        <span class="page-info">{{ currentPage }} .. {{ totalPages }}</span>
        <button class="page-btn" (click)="nextPage()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                style="width: 14px; height: 14px;">
                <polyline points="9 18 15 12 9 6" />
            </svg>
        </button>
    </div>
</div>
