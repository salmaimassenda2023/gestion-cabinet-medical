<form [formGroup]="clinicForm" (ngSubmit)="onSubmit()" class="clinic-form">
    <div class="form-group" *ngIf="clinic?.id">
        <label>Clinic ID</label>
        <input type="text" [value]="clinic?.id" readonly class="readonly-input">
    </div>

    <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" formControlName="name" placeholder="Enter clinic name">
    </div>

    <div class="form-group">
        <label for="address">Address</label>
        <input type="text" id="address" formControlName="address" placeholder="Enter address">
    </div>


    <div class="form-group">
        <label for="specialty">Specialty</label>
        <input type="text" id="specialty" formControlName="specialty" placeholder="Enter specialty">
    </div>

    

    <div class="form-group">
        <label for="status">Status</label>
        <select id="status" formControlName="status">
            <option value="active">Active</option>
            <option value="deactivate">Deactivate</option>
        </select>
    </div>

    <div class="form-group logo-section">
        <label>Logo</label>
        <div class="capture-container">
            <input type="file" (change)="onFileSelected($event)" accept="image/*">
            <div class="preview" *ngIf="clinicForm.get('logo')?.value">
                <label class="preview-label">Current Logo</label>
                <img [src]="clinicForm.get('logo')?.value" alt="Preview">
            </div>
        </div>
    </div>

    <div class="form-actions">
        <button type="button" class="btn btn-secondary" (click)="onCancel()">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="clinicForm.invalid">
            {{ clinic ? 'Update Clinic' : 'Add Clinic' }}
        </button>
    </div>
</form>
