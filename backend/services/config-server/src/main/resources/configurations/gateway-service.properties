# ==========================================
# SERVER CONFIGURATION
# ==========================================
server.port=8222

# ==========================================
# APPLICATION NAME
# ==========================================
spring.application.name=gateway-service

# ==========================================
# GATEWAY DISCOVERY
# ==========================================
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# ==========================================
# CORS CONFIGURATION
# ==========================================
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[0]=http://localhost:4200
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins[1]=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[0]=GET
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[1]=POST
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[2]=PUT
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[3]=DELETE
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods[4]=OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].max-age=3600

# ==========================================
# MICROSERVICES ROUTES (1 route = 1 microservice)
# ==========================================

# Utilisateur Service
spring.cloud.gateway.routes[0].id=utilisateur-service
spring.cloud.gateway.routes[0].uri=lb://UTILISATEUR-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/utilisateur/**

# Cabinet Service
spring.cloud.gateway.routes[1].id=cabinet-service
spring.cloud.gateway.routes[1].uri=lb://CABINET-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/cabinet/**

# Patient Service
spring.cloud.gateway.routes[2].id=patient-service
spring.cloud.gateway.routes[2].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/patient/**

# RendezVous Service
spring.cloud.gateway.routes[3].id=rendezVous-service
spring.cloud.gateway.routes[3].uri=lb://RENDEZVOUS-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/rendezvous/**

# Dossier Medical Service
spring.cloud.gateway.routes[4].id=dossier-medical-service
spring.cloud.gateway.routes[4].uri=lb://DOSSIER-MEDICAL-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/dossier-medical/**

# Consultation Service
spring.cloud.gateway.routes[5].id=consultation-service
spring.cloud.gateway.routes[5].uri=lb://CONSULTATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/consultation/**

# Facture Service
spring.cloud.gateway.routes[6].id=facture-service
spring.cloud.gateway.routes[6].uri=lb://FACTURE-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/facture/**

# Notification Service
spring.cloud.gateway.routes[7].id=notification-service
spring.cloud.gateway.routes[7].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/notification/**

# Medicament Service
spring.cloud.gateway.routes[8].id=medicament-service
spring.cloud.gateway.routes[8].uri=lb://MEDICAMENT-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/medicament/**

# ?? Route spécifique pour le webhook Stripe (direct, pas via discovery)
spring.cloud.gateway.routes[9].id=stripe-webhook
spring.cloud.gateway.routes[9].uri=http://localhost:8083
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/cabinet/webhooks/stripe

# ==========================================
# OAUTH2 SECURITY CONFIGURATION
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9098/realms/cabinet-medical
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9098/realms/cabinet-medical/protocol/openid-connect/certs



# ==========================================
# ACTUATOR ENDPOINTS
# ==========================================
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.gateway.access=unrestricted


# ==========================================
# ZIPKIN TRACING
# ==========================================
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# ==========================================
# LOGGING
# ==========================================
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.reactor.netty=INFO

