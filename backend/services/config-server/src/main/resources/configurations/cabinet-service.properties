# Management Endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Logging Configuration
logging.level.com.cabinetmedical=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Configuration personnalisée
cabinet.abonnement.alerte-jours-avant-expiration=7
cabinet.abonnement.verification-cron=0 0 9 * * ?

# Application Configuration
application.config.utilisateur-url=http://localhost:8082/api/utilisateur/
